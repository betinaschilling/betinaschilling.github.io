<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="ComuniDados — início">Comuni<span>Dados</span></a>
  <nav id="main-menu" aria-label="Navegação principal">
    {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
  <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-menu">Menu</button>
</header>
