<header class="mb-auto">
    <div class="brand-lockup mb-4 mb-md-0">
        <a class="brand-mark text-decoration-none" href="{{ '/' | relative_url }}" aria-label="ComuniDados">
            <span class="brand-kicker">Revista-laboratório</span>
            <span class="brand-name">ComuniDados</span>
        </a>
    </div>
    <nav class="nav site-nav" aria-label="Navegação principal">
        {% for link in site.navigation %}
        {% assign is_active = link.url == page.url %}
        <a class="nav-link{% if is_active %} active{% endif %}"{% if is_active %} aria-current="page"{% endif %} href="{{ link.url | relative_url }}">{{ link.title }}</a>
        {% endfor %}
    </nav>
</header>
