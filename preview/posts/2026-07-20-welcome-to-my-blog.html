<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bem-vindo(a) ao meu blog</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header class="site-header"><h1>Bem-vindo(a) ao meu blog</h1></header>
<main>
<div id="content"></div>
</main>
<footer style="margin-top:2rem;color:#666">Preview gerado localmente</footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const md = `

Este é um post de exemplo. Escreva aqui sobre seus interesses, experiências ou estudos. Posts ficam em \`_posts/\` e aparecem automaticamente na seção Artigos.

- Troque o título
- Adicione conteúdo
- Publique quando pronto
`;
document.getElementById('content').innerHTML = marked.parse(md);
</script>
</body>
</html>
