            label: false
            type: string
            default: page
            hidden: true
          - name: title
            label: Título
            type: string
            required: true
          - name: description
            label: Descrição
            type: text
            required: true
          - name: permalink
            label: Caminho público
            type: string
            required: true
            readonly: true
          - name: body
            label: Conteúdo
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: images
              path: institutional
              rename: safe
      - name: curriculum
        label: Currículo
        type: file
        path: curriculo.md
        format: yaml-frontmatter
        fields:
          - name: layout
            label: false
